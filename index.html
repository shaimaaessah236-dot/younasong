    <script>
      // Suppress Vite websocket and dev connection notices in iframe environment
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        var origLog = console.log;
        var origInfo = console.info;
        var origDebug = console.debug;
        var isViteNotice = function(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var str = String((item && (item.message || item.stack)) ? (item.message + ' ' + (item.stack || '')) : item);
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite:') !== -1 ||
              str.indexOf('WebSocket connection to') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('vite-hmr') !== -1
            ) {
              return true;
            }
          }
          return false;
        };
        console.error = function() {
          if (!isViteNotice(arguments)) origError.apply(console, arguments);
        };
        console.warn = function() {
          if (!isViteNotice(arguments)) origWarn.apply(console, arguments);
        };
        console.log = function() {
          if (!isViteNotice(arguments)) origLog.apply(console, arguments);
        };
        console.info = function() {
          if (!isViteNotice(arguments)) origInfo.apply(console, arguments);
        };
        console.debug = function() {
          if (!isViteNotice(arguments)) origDebug.apply(console, arguments);
        };
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && isViteNotice([event.reason])) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
          window.addEventListener('error', function(event) {
            if (event.message && isViteNotice([event.message, event.error])) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
